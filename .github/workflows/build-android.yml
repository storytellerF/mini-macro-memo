name: Build Android APK

on:
  release:
    types: [published]
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  RELEASE_TAG: ${{ github.event.release.tag_name }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check SDK compatibility and source
        run: |
          npx expo install --check
          npx expo-doctor
          npx tsc --noEmit
          npm run lint
          npx expo export --platform web

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Build release APK
        run: npx expo prebuild && cd android && ./gradlew assembleRelease
        env:
          com.storyteller_f.sign_path: ${{ secrets.COM_STORYTELLER_F_SIGN_PATH }}
          com.storyteller_f.sign_key: ${{ secrets.COM_STORYTELLER_F_SIGN_KEY }}
          com.storyteller_f.sign_alias: ${{ secrets.COM_STORYTELLER_F_SIGN_ALIAS }}
          com.storyteller_f.sign_store_password: ${{ secrets.COM_STORYTELLER_F_SIGN_STORE_PASSWORD }}
          com.storyteller_f.sign_key_password: ${{ secrets.COM_STORYTELLER_F_SIGN_KEY_PASSWORD }}
          # GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=512m"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: error

  release:
    name: Upload release assets
    needs: build
    if: (github.event_name == 'release')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: app-release-apk
          path: release-assets

      - name: Upload release assets
        shell: bash
        run: |
          mapfile -d '' assets < <(find release-assets -type f -print0)
          if (( ${#assets[@]} == 0 )); then
            echo "No release assets found" >&2
            exit 1
          fi
          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
